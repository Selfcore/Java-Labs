<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Books</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .cards-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }

        .book-card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            width: 200px;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .book-card h3 {
            margin: 0 0 10px 0;
        }

        .book-card p {
            margin: 5px 0;
        }

        .card-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        .card-buttons a {
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            font-size: 12px;
        }

        .card-buttons a.delete {
            background-color: #dc3545;
        }

        .filter-section {
            max-width: 400px;
            height: auto;
            margin-top: 10px;
            margin-bottom: 10px;
         }

        .filter-section input {
            width: 200px;
        }

        .filter-section label {
            display: inline-block;
            width: 120px;
        }
    </style>
</head>
<body>
<h1>Books</h1>

<section class="filter-section">
    <form method="get" th:action="@{/}">
        Title: <input type="text" name="title" th:value="${param.title}"><br>
        Author: <input type="text" name="author" th:value="${param.author}"><br>
        Pages: <input type="number" name="pages" th:value="${param.pages}"><br>
        <button type="submit">Filter</button>
    </form>
</section>

<a th:href="@{/new}">Add New Book</a>

<div class="cards-container">
    <div class="book-card" th:each="book : ${books}">
        <h3 th:text="${book.title}">Title</h3>
        <p><strong>Author:</strong> <span th:text="${book.author}">Author</span></p>
        <p><strong>Pages:</strong> <span th:text="${book.pages}">100</span></p>
        <p><strong>Genre:</strong> <span th:text="${book.genre}"></span></p>
        <label> <strong>Description:</strong>
            <textarea th:text="${book.description}"/>
        </label>
        <div class="card-buttons">
            <a th:href="@{'/delete/' + ${book.id}}" class="delete">Delete</a>
            <a th:href="@{'/edit/' + ${book.id}}">Edit</a>
        </div>
    </div>
</div>

</body>
</html>
