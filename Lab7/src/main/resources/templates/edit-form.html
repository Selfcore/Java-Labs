<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Book</title>
</head>
<body>

    <h2>Edit Book</h2>

    <form th:action="@{'/edit/' + ${book.id}}" th:object="${book}" method="post">

        Title:
        <input type="text" th:field="*{title}">
        <br><br>

        Author:
        <input type="text" th:field="*{author}">
        <br><br>

        Pages:
        <input type="number" th:field="*{pages}">
        <br><br>

        Genre:
        <input type="text" th:field="*{genre}">
        <br><br>

        Description:
        <br>
        <textarea rows="5" cols="40" th:field="*{description}"></textarea>
        <br><br>

        <button type="submit">Save</button>
    </form>

    <br>
    <a href="/">Back</a>

</body>
</html>
