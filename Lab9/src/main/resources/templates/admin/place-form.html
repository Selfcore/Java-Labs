<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>New Place</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
        }

        .container {
            width: 40%;
            margin: 60px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .actions {
            margin-top: 25px;
        }

        .btn {
            padding: 10px 16px;
            background: #0984e3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn:hover {
            background: #0866b3;
        }

        a {
            margin-left: 15px;
            text-decoration: none;
            color: #0984e3;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Add new place</h2>

    <form th:action="@{/admin/places}" th:object="${place}" method="post">

        <label>Name</label>
        <input type="text" th:field="*{name}" required>

        <label>Address</label>
        <input type="text" th:field="*{address}" required>

        <div class="actions">
            <button class="btn" type="submit">Save</button>
            <a href="/admin/places">Cancel</a>
        </div>

    </form>

</div>

</body>
</html>
