<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>New Event</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #0984e3;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0866b3;
        }

        .back-link {
            margin-top: 15px;
            text-align: center;
        }

        .back-link a {
            color: #0984e3;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Create New Event</h2>

    <form th:action="@{/admin/events}" th:object="${event}" method="post">

        <label>Name</label>
        <input type="text" th:field="*{name}" required/>

        <label>Date</label>
        <input type="date" th:field="*{eventDate}" required/>

        <label>Place</label>
        <select th:field="*{place}" required>
            <option th:each="p : ${places}"
                    th:value="${p.id}"
                    th:text="${p.name}">
            </option>
        </select>

        <label>Ticket count</label>
        <input type="number" name="ticketCount" min="1" required/>

        <label>Ticket price</label>
        <input type="number" name="ticketPrice" min="0" required/>

        <button type="submit">Create Event</button>
    </form>

    <div class="back-link">
        <a th:href="@{/events}">Back to events</a>
    </div>
</div>

</body>
</html>
