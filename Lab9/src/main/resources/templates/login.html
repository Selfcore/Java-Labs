<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
        }

        .container {
            width: 400px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #0984e3;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0866b3;
        }

        .error {
            margin-top: 15px;
            padding: 10px;
            background: #ffe6e6;
            border: 1px solid #ffcccc;
            color: #d63031;
            border-radius: 4px;
            text-align: center;
        }

        .success {
            margin-top: 15px;
            padding: 10px;
            background: #e6fffa;
            border: 1px solid #b2f5ea;
            color: #065f46;
            border-radius: 4px;
            text-align: center;
        }

        .register-link {
            margin-top: 20px;
            text-align: center;
        }

        .register-link a {
            color: #0984e3;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Login</h2>

    <form th:action="@{/login}" method="post">

        <label>Username</label>
        <input type="text" name="username" required/>

        <label>Password</label>
        <input type="password" name="password" required/>

        <button type="submit">Login</button>
    </form>

    <div th:if="${param.error}" class="error">
        Invalid username or password
    </div>

    <div th:if="${param.registered}" class="success">
        Registration successful. Please login.
    </div>

    <div class="register-link">
        Don’t have an account?
        <a th:href="@{/register}">Register</a>
    </div>

</div>

</body>
</html>
